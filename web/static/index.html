<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Queue Dashboard</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <h1>⚙️ Job Queue Dashboard</h1>
  <div class="sub">Reliable background job processing — Go + PostgreSQL</div>
</header>

<main>
  <section class="stats-grid" id="stats-grid">
    <div class="stat-card"><div class="stat-value" id="stat-total">–</div><div class="stat-label">Total Jobs</div></div>
    <div class="stat-card pending"><div class="stat-value" id="stat-pending">–</div><div class="stat-label">Pending</div></div>
    <div class="stat-card processing"><div class="stat-value" id="stat-processing">–</div><div class="stat-label">Processing</div></div>
    <div class="stat-card completed"><div class="stat-value" id="stat-completed">–</div><div class="stat-label">Completed</div></div>
    <div class="stat-card failed"><div class="stat-value" id="stat-failed">–</div><div class="stat-label">Failed</div></div>
    <div class="stat-card workers"><div class="stat-value" id="stat-workers">–</div><div class="stat-label">Active Workers</div></div>
  </section>

  <section class="panel">
    <h2>Submit a Job</h2>
    <form id="job-form">
      <div class="form-row">
        <label for="job-type">Type</label>
        <select id="job-type">
          <option value="email">email</option>
          <option value="webhook">webhook</option>
          <option value="report">report</option>
        </select>

        <label for="max-attempts">Max attempts</label>
        <input type="number" id="max-attempts" value="3" min="1" max="10">

        <button type="submit">Submit Job</button>
      </div>
      <div class="form-row">
        <label for="payload">Payload (JSON)</label>
        <input type="text" id="payload" value='{"to":"user@example.com","subject":"Welcome"}'>
      </div>
    </form>
    <div id="submit-status"></div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>Jobs</h2>
      <div class="filters">
        <label for="status-filter">Filter:</label>
        <select id="status-filter">
          <option value="">all</option>
          <option value="pending">pending</option>
          <option value="processing">processing</option>
          <option value="retry">retry</option>
          <option value="completed">completed</option>
          <option value="failed">failed</option>
        </select>
        <button id="refresh-btn">Refresh</button>
        <label class="auto-refresh"><input type="checkbox" id="auto-refresh" checked> auto-refresh</label>
      </div>
    </div>
    <table id="jobs-table">
      <thead>
        <tr>
          <th>ID</th><th>Type</th><th>Status</th><th>Attempts</th><th>Created</th><th>Updated</th><th></th>
        </tr>
      </thead>
      <tbody id="jobs-body"></tbody>
    </table>
  </section>
</main>

<div id="job-modal" class="modal hidden">
  <div class="modal-content">
    <button id="modal-close" class="modal-close">&times;</button>
    <h2>Job Details</h2>
    <pre id="modal-body"></pre>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
