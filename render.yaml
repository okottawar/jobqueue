services:
  - type: web
    name: jobqueue
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      - key: WORKER_COUNT
        value: "5"
      - key: MAX_RETRIES
        value: "3"
      - key: PORT
        value: "8080"
    healthCheckPath: /healthz
