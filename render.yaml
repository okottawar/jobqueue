services:
  - type: web
    name: jobqueue
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: WORKER_COUNT
        value: "5"
      - key: MAX_RETRIES
        value: "3"
      - key: PORT
        value: "8080"
    healthCheckPath: /healthz
